name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, format & test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.NUGET_PACKAGES_TOKEN }}
        run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"
          if-no-files-found: ignore

  docker-publish:
    name: Publish Docker image to GHCR
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUGET_GITHUB_TOKEN=${{ secrets.NUGET_PACKAGES_TOKEN }}
            GITHUB_ACTOR=${{ github.actor }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure Container Apps
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Wait for container app provisioning
        env:
          AZURE_CONTAINERAPP: shopniu-api
          AZURE_RESOURCE_GROUP: shopniu
        run: |
          for i in $(seq 1 60); do
            state=$(az containerapp show --name "$AZURE_CONTAINERAPP" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.provisioningState -o tsv 2>/dev/null || echo Unknown)
            echo "provisioningState=$state"
            [ "$state" = "Succeeded" ] && exit 0
            sleep 10
          done
          echo "Timeout waiting for container app provisioning" >&2
          exit 1

      - name: Deploy to Azure Container Apps
        timeout-minutes: 15
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ghcr.io/${{ github.repository }}:${{ github.sha }}
          containerAppName: shopniu-api
          resourceGroup: shopniu
          containerAppEnvironment: thankfulmushroom-4e17c339
          registry-url: ghcr.io
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.NUGET_PACKAGES_TOKEN }}
          targetPort: 8080

      - name: Wait for revision ready
        env:
          AZURE_CONTAINERAPP: shopniu-api
          AZURE_RESOURCE_GROUP: shopniu
        run: |
          for i in $(seq 1 60); do
            latest=$(az containerapp show --name "$AZURE_CONTAINERAPP" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.latestRevisionName -o tsv 2>/dev/null || echo "")
            ready=$(az containerapp show --name "$AZURE_CONTAINERAPP" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.latestReadyRevisionName -o tsv 2>/dev/null || echo "")
            echo "latestRevision=$latest readyRevision=$ready"
            [ -n "$latest" ] && [ "$latest" = "$ready" ] && exit 0
            sleep 5
          done
          echo "Timeout waiting for revision to become ready" >&2
          exit 1

      - name: Azure logout
        if: always()
        run: az logout
